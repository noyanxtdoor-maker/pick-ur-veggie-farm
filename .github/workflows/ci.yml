# Stage D Phase 0 — Commit #7: Tier-1 Continuous Integration (C6 §8).
# Reuses the existing npm scripts (C1 §8 local↔CI parity); adds no npm deps.
# These status checks are what GitHub branch protection will later require (C4 §10).
name: CI

on:
  push:
    branches:
      - 'feature/**'
  pull_request:
    branches:
      - develop
      - main

jobs:
  verify:
    name: Verify (install · type · test · build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (clean, lockfile-verified)
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Stage D Phase 1 — Tier-2 architecture guards (C6 §8 / C3 §12). Required from Migration #1.
  db-guards:
    name: DB guards (RLS · tenant · audit · drift · no-role-name · no-float)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (clean, lockfile-verified)
        run: npm ci

      - name: Ensure psql client
        run: psql --version || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: Static guards (no-role-name-auth, no-float-money)
        run: npm run guard:static

      - name: Start local Supabase
        run: npx supabase start

      - name: Apply migrations (deterministic reset)
        run: npm run db:reset

      - name: DB guards (rls-enabled, tenant-ownership, audit-immutability)
        run: npm run guard:db

      - name: Behavioral security tests (cross-tenant · permission · lifecycle · audit-immutability)
        run: npm run guard:rls

      - name: Bootstrap security tests (one-time · authorized · atomic · audited)
        run: npm run guard:bootstrap

      - name: Organization security tests (authenticated writes · invitations · membership · isolation)
        run: npm run guard:org

      - name: Crop security tests (company · branch isolation · permission · archived-usage · audit)
        run: npm run guard:crop

      - name: Inventory security tests (ledger-derived · tamper-proof · append-only · opening · isolation)
        run: npm run guard:inventory

      - name: POS sale security tests (balanced posting · stock decrement · idempotency · no-oversell · price-authority)
        run: npm run guard:pos

      - name: Accounting security tests (balanced cash postings · void-not-delete · GL-reconciled statements)
        run: npm run guard:accounting

      - name: Payroll security tests (balanced wage/advance postings · wage authority · derived balance · statements tie)
        run: npm run guard:payroll

      - name: Scheduling security tests (tenant · branch isolation · permission gating · audit)
        run: npm run guard:scheduling

      - name: Projects security tests (tenant · branch isolation · task parent-scoping · permission gating · audit)
        run: npm run guard:projects

      - name: Customers security tests (tenant isolation · customer.manage/read gates · non-money attribution · AR standing)
        run: npm run guard:customers

      - name: Payments security tests (account routing · void mirrors account · transfer zero-net/no-P&L · derived balances · gates)
        run: npm run guard:payments

      - name: Auth lifecycle security tests (signup trigger · pending-is-blind · approval queue gate · suspension · idempotency)
        run: npm run guard:auth

      - name: Approvals & Roles P1C security tests (rank ladder · rank-enforced revoke/appoint · role governance · per-user overrides)
        run: npm run guard:approvals

      - name: Payroll-role-link P1D security tests (atomic payroll linking · managed positions · job_title gating)
        run: npm run guard:payroll-link

      - name: Cross-tenant helper hardening P1E security tests (account/category-seed helpers reject non-members)
        run: npm run guard:cross-tenant

      - name: P1L self-service-username security tests (own-row RPC, format/uniqueness/suspended/grant shape)
        run: npm run guard:p1l

      - name: P1M revoke-approval-workflow security tests (separation of duties, self-revoke/self-approve denied)
        run: npm run guard:p1m

      - name: P1N post-approval username onboarding security tests (one-time gate, format/uniqueness, grant shape)
        run: npm run guard:p1n

      - name: P1H.1 project.read-for-all-roles security tests (employee/operator read, admin+ only manage)
        run: npm run guard:p1h1

      - name: P1C2 module-access-overrides security tests (view module count, resolver view/manage/none, deny-override, grant shape)
        run: npm run guard:p1c2

      - name: P1C3 nav-access-and-admin-narrowing security tests (nav-shaped resolver, admin default narrowing, RPC approve/manage split, read-key-deny regression, grant shape)
        run: npm run guard:p1c3

      - name: P1C4 role default-access editor security tests (live effect on current members, rank protection, owner role unreachable, grant shape)
        run: npm run guard:p1c4

      - name: P1O POS product-removal approval security tests (instant manage removal, queued request+approve/reject, override composition, self-approve denied, grant shape)
        run: npm run guard:p1o

      - name: P1P MPIN security-layer tests (format/deny-list validation, escalating lockout survives the RPC transaction, change_mpin re-auth, cross-user isolation, onboarding sequence, grant shape)
        run: npm run guard:p1p

      - name: Copilot degrade guard (CAP-VG1 v1 = zero Postgres surface — no tables/permissions/policies/functions)
        run: npm run guard:copilot

      - name: P2N2 void-sale approval workflow security tests (separation of duties, financial-account-aware reversal, one-pending-per-invoice, double-approve idempotency)
        run: npm run guard:p2n2

      - name: T3.1 vendors + cost schedule + AP ledger security tests (invoice/payment journal balance, AP standing, cost-schedule auto-close, permission grant shape)
        run: npm run guard:t3-1

      - name: T3.2 purchase-vendor-link security tests (vendor snapshot on purchase, cross-company/archived-vendor rejection, backward-compat 11-arg call)
        run: npm run guard:t3-2

      - name: P2O.1 anon RPC lockdown security tests (uuidv7 PUBLIC-grant closed, authenticated/service_role/owner unaffected)
        run: npm run guard:p2o1

      - name: P1K realtime publication coverage (every client-subscribed table is actually published)
        run: npm run guard:p1k

      - name: P2PO1 purchase-order request/approval security tests (request-vs-decide split, approval never moves stock, fulfillment item-match + Approved-only gate, double-decision, self-decide denial, cross-tenant isolation)
        run: npm run guard:p2po1

      - name: P2ET1 expiration-tracking + branch stock-transfer security tests (write-off at batch cost, transfer drains/credits both sides + preserves FIFO cost/age, cross-branch/cross-company denial, 14-arg regression)
        run: npm run guard:p2et1

      - name: Schema-drift guard
        run: npm run guard:drift

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop
